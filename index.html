<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#08080a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="FORGE"/>
<link rel="apple-touch-icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="%2308080a"/><text x="256" y="350" font-family="system-ui,sans-serif" font-size="280" font-weight="900" fill="%23e9b949" text-anchor="middle">F</text></svg>'/>
<title>FORGE — Athletic Level-Up System</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
  --bg:#08080a;--surface:#131317;--surface2:#1b1b21;--line:#26262e;
  --txt:#f4f4f7;--muted:#8a8a99;--gold:#e9b949;--gold2:#f7d777;
  --green:#37d67a;--red:#ff5c5c;--blue:#5b8cff;--r:16px;
}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;transition:padding-bottom .2s;
}
body.has-rest{padding-bottom:calc(156px + env(safe-area-inset-bottom))}
.app{max-width:540px;margin:0 auto;padding:0 14px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit}
.hidden{display:none!important}

#hdr{position:sticky;top:0;z-index:40;background:rgba(8,8,10,.94);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);padding:10px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.brand{font-size:20px;font-weight:800;letter-spacing:.22em;color:var(--gold)}
.brand .dot{color:var(--muted);margin-left:2px}
.icon-btn{background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  width:36px;height:36px;border-radius:12px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:#26262e}
.xpmini-top{display:flex;justify-content:space-between;font-size:11px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.xpmini-top b{color:var(--gold)}
.bar{height:7px;background:#1c1c22;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c9932b,#f7d777);
  transition:width .7s cubic-bezier(.2,.8,.2,1)}

.card{background:linear-gradient(180deg,#15151a,#111115);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card.tight{padding:13px}
.card.gold{border-color:rgba(233,185,73,.35);background:linear-gradient(160deg,#1d1a12,#121116)}
.sec-title{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:20px 2px 10px}
.sec-title:first-child{margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);
  color:var(--txt);font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.985);filter:brightness(1.15)}
.btn-gold{background:linear-gradient(135deg,#f7d777,#e0a832);color:#241a06;border-color:transparent;
  box-shadow:0 6px 22px -8px rgba(233,185,73,.7)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:11px;width:auto}
.btn-danger{color:var(--red);border-color:rgba(255,92,92,.3);background:rgba(255,92,92,.08)}
.btn-green{background:linear-gradient(135deg,#37d67a,#22a95c);color:#04180d;border-color:transparent}

.hero{background:
  radial-gradient(120% 120% at 85% 0%,rgba(233,185,73,.16),transparent 55%),
  linear-gradient(180deg,#17171c,#111115);
  border:1px solid rgba(233,185,73,.22);border-radius:20px;padding:18px;margin-bottom:12px}
.hero-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.lvl-ring{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;flex:0 0 64px;
  background:conic-gradient(var(--gold) var(--pct,0%),#26262e 0);
  position:relative}
.lvl-ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#111115}
.lvl-ring span{position:relative;z-index:1;font-size:21px;font-weight:800;color:var(--gold);line-height:1}
.lvl-ring small{position:relative;z-index:1;font-size:8px;letter-spacing:.14em;color:var(--muted);margin-top:1px}
.hero-name{font-size:17px;font-weight:800}
.hero-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:2px}

.stat{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-size:19px;font-weight:800;line-height:1.15}
.stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:700}
.stat.gold .v{color:var(--gold)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;
  font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.gold{background:rgba(233,185,73,.13);color:var(--gold);border-color:rgba(233,185,73,.3)}
.chip.green{background:rgba(55,214,122,.12);color:var(--green);border-color:rgba(55,214,122,.3)}
.chip.red{background:rgba(255,92,92,.12);color:var(--red);border-color:rgba(255,92,92,.28)}
.chip.blue{background:rgba(91,140,255,.12);color:var(--blue);border-color:rgba(91,140,255,.3)}

/* EXERCISE VISUALS */
.ex-thumb{width:44px;height:44px;border-radius:10px;background:#111115;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 44px;overflow:hidden}
.ex-anim-box{display:flex;align-items:center;justify-content:center;background:#111115;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;overflow:hidden}

.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-size:15.5px;font-weight:800}
.dots{letter-spacing:2px;font-size:10px;color:var(--gold);margin-top:3px}
.dots i{opacity:.22;font-style:normal}
.dots i.on{opacity:1}
.setrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid #1f1f26}
.setrow:first-of-type{border-top:0}
.setnum{width:52px;font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.setrow input[type=number]{width:64px;background:#0e0e12;border:1px solid var(--line);
  color:var(--txt);border-radius:9px;padding:8px 9px;font-size:14px;font-weight:700;text-align:center;
  -moz-appearance:textfield}
.setrow input[type=number]::-webkit-outer-spin-button,
.setrow input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setrow .unit{font-size:11px;color:var(--muted);width:20px}
.check{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);background:#0e0e12;
  color:transparent;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex:0 0 32px;transition:.15s}
.check.on{background:var(--gold);border-color:var(--gold);color:#241a06}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:#0e0e12;
  color:var(--muted);font-size:11.5px;font-weight:800;letter-spacing:.05em;cursor:pointer}
.seg button.on{background:rgba(233,185,73,.15);border-color:rgba(233,185,73,.45);color:var(--gold)}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(13,13,16,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;
  color:var(--muted);font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 0;cursor:pointer;transition:color .15s}
.tab.active{color:var(--gold)}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

.restbar{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:45;
  display:flex;align-items:center;gap:12px;padding:11px 16px;
  background:rgba(24,20,10,.97);border-top:1px solid rgba(233,185,73,.3);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.restbar .t{font-size:23px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;min-width:70px}
.restbar .lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800}

.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);display:flex;
  align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(4px)}
.modal-inner{background:#14141a;border:1px solid var(--line);border-bottom:0;
  border-radius:22px 22px 0 0;width:100%;max-width:540px;max-height:88vh;overflow-y:auto;
  padding:8px 18px calc(28px + env(safe-area-inset-bottom));animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
.grab{width:38px;height:4px;border-radius:99px;background:#33333d;margin:6px auto 14px}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  z-index:200;background:#1e1e26;border:1px solid var(--line);color:var(--txt);
  padding:11px 18px;border-radius:13px;font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:.28s;max-width:88%;text-align:center;
  box-shadow:0 10px 30px -10px #000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.gold{border-color:rgba(233,185,73,.5);color:var(--gold)}

#levelup{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  background:rgba(6,5,2,.93);backdrop-filter:blur(8px);flex-direction:column;gap:6px}
.lu-ring{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--gold) 100%,#26262e 0);position:relative;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.lu-ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#0d0b06}
.lu-ring b{position:relative;z-index:1;font-size:46px;color:var(--gold);font-weight:900}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:#0e0e12;border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit;font-weight:600}
input:focus,select,textarea:focus{outline:none;border-color:rgba(233,185,73,.5)}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:800;margin-bottom:5px}
textarea{resize:vertical;min-height:64px}
.list-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #1f1f26}
.list-item:first-child{border-top:0}
.avatar{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1px solid var(--line);font-size:16px;flex:0 0 38px}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:13px}
.pbar{height:6px;background:#1c1c22;border-radius:99px;overflow:hidden;flex:1}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,#c9932b,#f7d777);border-radius:99px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.photo-grid .ph{position:relative;aspect-ratio:3/4;border-radius:11px;overflow:hidden;
  background:#0e0e12;border:1px solid var(--line)}
.photo-grid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photo-grid .ph .tag{position:absolute;left:4px;bottom:4px;font-size:8.5px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.72);padding:2px 6px;border-radius:6px;color:var(--gold)}
.subtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface2);padding:4px;
  border-radius:13px;border:1px solid var(--line)}
.subtabs button{flex:1;padding:9px;border:0;background:none;color:var(--muted);font-size:12px;
  font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:10px;cursor:pointer}
.subtabs button.on{background:#26262e;color:var(--txt)}
.ach{display:flex;gap:11px;align-items:center;padding:10px;border-radius:13px;
  background:var(--surface2);border:1px solid var(--line);margin-bottom:7px}
.ach.locked{opacity:.42}
.ach .ico{width:36px;height:36px;border-radius:10px;background:rgba(233,185,73,.14);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 36px}
.note-box{background:rgba(91,140,255,.08);border:1px solid rgba(91,140,255,.25);
  border-radius:13px;padding:12px;font-size:12.5px;color:#b9c8ee;line-height:1.5}
.warn-box{background:rgba(255,92,92,.07);border:1px solid rgba(255,92,92,.25);
  border-radius:13px;padding:12px;font-size:12.5px;color:#f3b5b5;line-height:1.5}
.gold-box{background:rgba(233,185,73,.07);border:1px solid rgba(233,185,73,.25);
  border-radius:13px;padding:12px;font-size:12.5px;color:#e8d5a8;line-height:1.5}
table.hist{width:100%;border-collapse:collapse;font-size:12.5px}
table.hist th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:800}
table.hist td{padding:8px 4px;border-bottom:1px solid #1c1c22}
table.hist td:first-child{color:var(--muted)}
.focus-mode .card:not(.focus-active){display:none}
.focus-mode #tabs{display:none}
.focus-mode .app{max-width:640px}
</style>
</head>
<body>
<div class="app">
  <header id="hdr"></header>
  <main id="view"></main>
</div>
<nav id="tabs"></nav>
<div id="restbar" class="restbar hidden"></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>
<div id="levelup" class="hidden"></div>

<script>
/* ==========================================================================
   FORGE — The Athletic Level-Up System
   Accurate, exercise-specific animated SVG flashcards + interactive variations.
   ========================================================================== */

(function(){
  try{
    const manifest = {
      name: 'FORGE — Athletic Level-Up',
      short_name: 'FORGE',
      description: 'Personal gamified fitness progression system',
      start_url: '.',
      scope: '.',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#08080a',
      theme_color: '#08080a',
      icons: [{
        src: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="%2308080a"/><text x="256" y="350" font-family="system-ui,sans-serif" font-size="280" font-weight="900" fill="%23e9b949" text-anchor="middle">F</text></svg>',
        sizes: '512x512', type: 'image/svg+xml', purpose: 'any'
      }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  }catch(e){ }
})();

const EQ_ALL=['none','bands','dumbbells','gym'];
const EQ_B=['bands','dumbbells','gym'];
const EQ_D=['dumbbells','gym'];
const EQ_G=['gym'];

const EXERCISES = {
'wall-push-up':{name:'Wall Push-Up',cat:'push',diff:1,equip:EQ_ALL,type:'reps',muscles:['Chest','Triceps','Shoulders'],
  steps:['Stand an arm’s length from a wall, hands at shoulder height.','Keep your body in one straight line and lower your chest to the wall.','Press back out smoothly, ribs down, without flaring your elbows.'],easier:null,harder:'incline-push-up'},
'incline-push-up':{name:'Incline Push-Up',cat:'push',diff:1,equip:EQ_ALL,type:'reps',muscles:['Chest','Triceps','Shoulders'],
  steps:['Place your hands on a sturdy elevated surface (table, bench, or step).','Keep a straight line from head to heels and brace your core.','Lower until your chest nearly touches, then press back up.'],easier:'wall-push-up',harder:'push-up'},
'knee-push-up':{name:'Knee Push-Up',cat:'push',diff:1,equip:EQ_ALL,type:'reps',muscles:['Chest','Triceps','Shoulders'],
  steps:['Set up on your knees with hands slightly wider than shoulders.','Keep hips in line with your shoulders — do not pike up.','Lower your chest toward the floor and press back up.'],easier:'incline-push-up',harder:'push-up'},
'push-up':{name:'Push-Up',cat:'push',diff:2,equip:EQ_ALL,type:'reps',muscles:['Chest','Triceps','Front delts','Core'],
  steps:['Hands slightly wider than shoulders, body in one rigid line.','Lower until your chest is a fist from the floor. Elbows about 45°.','Press up without letting hips sag or pike.'],easier:'knee-push-up',harder:'diamond-push-up'},
'wide-push-up':{name:'Wide Push-Up',cat:'push',diff:2,equip:EQ_ALL,type:'reps',muscles:['Chest','Front delts'],
  steps:['Set hands wider than shoulder width.','Lower with control, feeling a stretch across the chest.','Keep elbows from flaring past 70°.'],easier:'push-up',harder:'archer-push-up'},
'diamond-push-up':{name:'Diamond Push-Up',cat:'push',diff:3,equip:EQ_ALL,type:'reps',muscles:['Triceps','Chest','Core'],
  steps:['Place hands together under your chest, thumbs and index fingers forming a diamond.','Keep elbows close to your ribs as you lower.','Press back up without shrugging your shoulders.'],easier:'push-up',harder:'pseudo-planche-push-up'},
'incline-pike-push-up':{name:'Incline Pike Push-Up',cat:'push',diff:2,equip:EQ_ALL,type:'reps',muscles:['Shoulders','Triceps','Upper chest'],
  steps:['Place hands on a low bench or step, hips high in an inverted V.','Bend your elbows to lower the top of your head toward the surface.','Press back up, keeping hips high throughout.'],easier:'push-up',harder:'pike-push-up'},
'pike-push-up':{name:'Pike Push-Up',cat:'push',diff:3,equip:EQ_ALL,type:'reps',muscles:['Shoulders','Triceps','Upper chest'],
  steps:['From a push-up position, walk your feet in and lift your hips high.','Lower the crown of your head toward the floor between your hands.','Press back up — this is your main no-equipment shoulder builder.'],easier:'incline-pike-push-up',harder:'decline-push-up'},
'decline-push-up':{name:'Decline Push-Up',cat:'push',diff:3,equip:EQ_ALL,type:'reps',muscles:['Upper chest','Front delts','Triceps'],
  steps:['Elevate your feet on a chair or step, hands on the floor.','Keep the body rigid and lower your chest toward the floor.','Press up without arching your lower back.'],easier:'push-up',harder:'archer-push-up'},
'archer-push-up':{name:'Archer Push-Up',cat:'push',diff:4,equip:EQ_ALL,type:'reps',muscles:['Chest','Triceps','Core'],
  steps:['Hands wide. Shift your weight toward one arm as you lower.','The far arm stays nearly straight, acting as a support.','Alternate sides each repetition.'],easier:'wide-push-up',harder:'one-arm-push-up-negative'},
'one-arm-push-up-negative':{name:'One-Arm Push-Up Negative',cat:'push',diff:5,equip:EQ_ALL,type:'reps',muscles:['Chest','Triceps','Core'],
  steps:['Set up in a push-up with feet wide and one hand behind your back.','Lower as slowly as you can control (3–5 seconds).','Reset with both hands to return to the top.'],easier:'archer-push-up',harder:null},
'pseudo-planche-push-up':{name:'Pseudo Planche Push-Up',cat:'push',diff:4,equip:EQ_ALL,type:'reps',muscles:['Chest','Front delts','Core'],
  steps:['Hands by your waist, fingers pointing back or out.','Lean your shoulders forward past your hands.','Lower and press while keeping that forward lean.'],easier:'diamond-push-up',harder:null},
'bench-dip':{name:'Bench Dip',cat:'push',diff:2,equip:EQ_ALL,type:'reps',muscles:['Triceps','Chest','Front delts'],

function pruneOldPhotos(silent){
  if(!S.photos || !S.photos.length) return 0;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - PHOTO_RETENTION_DAYS);
  const cutoffStr = dstr(cutoff);
  const before = S.photos.length;
  S.photos = S.photos.filter(p => p.date >= cutoffStr);
  const removed = before - S.photos.length;
  if(removed > 0){
    saveState();
    if(!silent) toast('Pruned '+removed+' photo(s) older than '+PHOTO_RETENTION_DAYS+' days');
  }
  return removed;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dstr(d){ d=d||new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function parseD(s){ const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function fmtDate(s){
  if(!s) return '';
  const t=todayStr();
  if(s===t) return 'Today';
  const y=new Date(); y.setDate(y.getDate()-1);
  if(s===dstr(y)) return 'Yesterday';
  return parseD(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
}
function fmtDateLong(s){ const d=parseD(s); return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function startOfWeek(d){ const x=new Date(d||new Date()); const w=(x.getDay()+6)%7;
  x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
function mmss(sec){ sec=Math.max(0,Math.round(sec));
  return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
function ex(id){ return EXERCISES[id]||{name:id,cat:'core',diff:1,equip:EQ_ALL,type:'reps',muscles:[],steps:[]}; }
function availableEx(id){ return ex(id).equip.indexOf(S.profile.equipment)>=0; }

function xpForLevel(l){ return 100 + (l-1)*45; }
function levelInfo(){

  return {level:lvl, into:remaining, need, pct:Math.min(100,(remaining/need)*100), title:titleFor(lvl)};
}
function titleFor(l){

function activityDates(){

  S.measurements.forEach(m=>set.add(m.date));

}
function computeStreak(){
  const days=activityDates();
  if(!days.size) return 0;
  let streak=0, restRun=0;
  const d=new Date(); d.setHours(12,0,0,0);
  for(let i=0;i<400;i++){
    const k=dstr(d);
    if(days.has(k)){ streak++; restRun=0; }
    else { restRun++; if(restRun>2) break; }
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function bestWeekCount(){

  return Math.max(0,...Object.values(map),0);
}
function bestMonthCount(){

  S.workouts.forEach(w=>{ const k=w.date.slice(0,7); map[k]=(map[k]||0)+1; });

}
function bestSet(ids){
  ids=Array.isArray(ids)?ids:[ids];
  let best=0;
  S.workouts.forEach(w=>{
    (w.entries||[]).forEach(e=>{
      if(ids.indexOf(e.exId)<0) return;
      (e.sets||[]).forEach(s=>{ if(s.done && Number(s.actual)>best) best=Number(s.actual); });
    });
  });
  return best;
}
function lifetimeReps(ids){
  let t=0;
  S.workouts.forEach(w=>{
    (w.entries||[]).forEach(e=>{
      if(ids.indexOf(e.exId)<0) return;
      (e.sets||[]).forEach(s=>{ if(s.done) t+=Number(s.actual)||0; });

}

function resolveSlot(slotId, eq){
  const m=SLOTS[slotId];
  if(!m) return 'bodyweight-squat';
  if(typeof m==='string') return m;
  return m[eq]||m.none;
}
function getTarget(exId, slot){
  const e=ex(exId);
  const p=S.progression[exId];
  const isTime = e.type==='time';
  const sets = (p&&p.sets) || slot.sets || 3;
  const val  = isTime
    ? ((p&&p.time) || slot.time || 30)
    : ((p&&p.reps) || slot.reps || 8);
  return {sets, val, isTime};
}
function progressionAdvice(exId){
  const p=S.progression[exId];
  if(!p||!p.note) return null;
  return p.note;
}
function updateProgression(entries){
  entries.forEach(entry=>{
    if(entry.skipped) return;
    const doneSets=entry.sets.filter(s=>s.done);
    if(!doneSets.length) return;
    const e=ex(entry.exId);
    const isTime = e.type==='time';
    const p = S.progression[entry.exId] || {sets:entry.sets.length, reps:isTime?0:entry.sets[0].target, time:isTime?entry.sets[0].target:0, success:0, fail:0};

    const totalTarget = entry.sets.reduce((a,s)=>a+Number(s.target||0),0) || 1;
    const totalActual = doneSets.reduce((a,s)=>a+Number(s.actual||0),0);
    const ratio = totalActual/totalTarget;
    const diff = entry.difficulty || 'moderate';

    if(ratio>=1 && diff!=='hard'){ p.success=(p.success||0)+1; p.fail=0; }
    else if(ratio<0.8){ p.fail=(p.fail||0)+1; p.success=0; }
    else { p.success=0; p.fail=0; }

    let note='';
    if(p.success>=2){
      if(!isTime && p.reps>=18){
        const harder=ex(entry.exId).harder;
        if(harder && availableEx(harder)){
          note='Ready for a harder variation: '+ex(harder).name+'. You have hit '+p.reps+'+ reps twice in a row.';
        } else {
          p.reps+=2; note='Add 2 reps — you cleared the target twice with control.';
        }
        p.success=0;
      } else if(isTime){
        p.time=(p.time||30)+5; note='Add 5 seconds — two solid sessions in a row.';
        p.success=0;
      } else {
        const inc=p.reps<12?2:1;
        p.reps=(p.reps||8)+inc;
        note='Add '+inc+' rep(s) — consistent completion at a comfortable effort.';
        p.success=0;
      }
    } else if(p.fail>=2){
      if(isTime){ p.time=Math.max(10,(p.time||30)-5); note='Reduced by 5s — the last two sessions fell short. Rebuild quality.'; }
      else { p.reps=Math.max(3,(p.reps||8)-1); note='Reduced by 1 rep — two short sessions in a row. Rebuild with clean form.'; }
      p.fail=0;
    } else if(ratio<1){
      note='Hold at the current level — target not fully completed.';
    } else if(diff==='hard'){
      note='Hold at the current level — session felt hard. Repeat before adding load.';
    } else {
      note='Hold — one more clean session before increasing.';
    }
    p.note=note;
    S.progression[entry.exId]=p;
  });
  saveState();
}
function checkAchievements(){
  const unlocked=[];
  ACHIEVEMENTS.forEach(a=>{
    if(S.achievements[a.id]) return;
    let ok=false;
    try{ ok=a.chk(); }catch(e){ ok=false; }
    if(ok){ S.achievements[a.id]={date:todayStr()}; unlocked.push(a); }
  });
  if(unlocked.length){
    S.xp+=unlocked.reduce((t,a)=>t+a.xp,0);
    saveState();
  }
  return unlocked;
}

/* -------------------- DAILY QUEST ENGINE -------------------- */
function todayQuestId(){
  const seed = todayStr().split('-').reduce((a,b)=>a+Number(b),0);
  return DAILY_QUESTS[seed % DAILY_QUESTS.length].id;
}
function ensureDailyQuest(){
  const today=todayStr();
  if(S.dailyQuests.date!==today){
    S.dailyQuests={ date:today, activeId:todayQuestId(), completed:[], claimedXP:0 };
    saveState();
  }
  return DAILY_QUESTS.find(q=>q.id===S.dailyQuests.activeId);
}
function questProgress(q){
  if(!q) return {current:0, target:1, complete:false};
  if(q.type==='exercise_sets'){
    let count=0;
    S.workouts.filter(w=>w.date===todayStr()).forEach(w=>{
      (w.entries||[]).forEach(e=>{
        if(q.exIds.indexOf(e.exId)<0) return;
        count+=e.sets.filter(s=>s.done).length;
      });
    });
    return {current:count, target:q.sets, complete:count>=q.sets};
  }
  if(q.type==='exercise_time'){
    let total=0;
    S.workouts.filter(w=>w.date===todayStr()).forEach(w=>{
      (w.entries||[]).forEach(e=>{
        if(q.exIds.indexOf(e.exId)<0) return;
        e.sets.forEach(s=>{ if(s.done) total+=Number(s.actual)||0; });
      });
    });
    return {current:total, target:q.totalTime, complete:total>=q.totalTime};
  }
  if(q.type==='category_sets'){
    let count=0;
    S.workouts.filter(w=>w.date===todayStr()).forEach(w=>{
      (w.entries||[]).forEach(e=>{
        if(ex(e.exId).cat!==q.cat) return;
        count+=e.sets.filter(s=>s.done).length;
      });
    });
    return {current:count, target:q.sets, complete:count>=q.sets};
  }
  if(q.type==='category_time'){
    let total=0;
    S.workouts.filter(w=>w.date===todayStr()).forEach(w=>{
      (w.entries||[]).forEach(e=>{
        if(ex(e.exId).cat!==q.cat) return;
        e.sets.forEach(s=>{ if(s.done) total+=Number(s.actual)||0; });
      });
    });
    return {current:total, target:q.totalTime, complete:total>=q.totalTime};
  }
  if(q.type==='workout_day'){
    const done=S.workouts.some(w=>w.date===todayStr() && w.dayId===q.dayId);
    return {current:done?1:0, target:1, complete:done};
  }
  return {current:0, target:1, complete:false};
}
function claimQuest(){
  const q=ensureDailyQuest();
  if(!q) return;
  if(S.dailyQuests.completed.indexOf(q.id)>=0){ toast('Quest already claimed'); return; }
  const p=questProgress(q);
  if(!p.complete){ toast('Quest not complete yet'); return; }
  S.dailyQuests.completed.push(q.id);
  S.dailyQuests.claimedXP+=q.xp;
  S.xp+=q.xp;
  checkAchievements();
  saveState();
  toast('+'+q.xp+' XP · '+q.label+' complete','gold');
  render();
}

/* -------------------- MUSCLE RANKS -------------------- */
function muscleXPForWorkout(w){
  const xp={push:0,pull:0,legs:0,core:0,conditioning:0};
  (w.entries||[]).forEach(e=>{
    if(e.skipped) return;
    const cat=ex(e.exId).cat;
    if(!xp[cat]) return;
    const done=e.sets.filter(s=>s.done).length;
    xp[cat]+=done*3;
  });
  return xp;
}
function addMuscleXP(w){
  const xp=muscleXPForWorkout(w);
  Object.keys(xp).forEach(k=>{ S.muscleXP[k]=(S.muscleXP[k]||0)+xp[k]; });
}
function rankIndexForXP(xp){
  for(let i=RANK_THRESHOLDS.length-1;i>=0;i--){ if(xp>=RANK_THRESHOLDS[i]) return i; }
  return 0;
}
function muscleRankData(){
  const out={};
  Object.keys(QUESTS).forEach(k=>{
    const xp=S.muscleXP[k]||0;
    const idx=rankIndexForXP(xp);
    out[k]={xp, rankIndex:idx, rank:RANK_NAMES[idx], next: RANK_THRESHOLDS[idx+1]||null};
  });
  return out;
}

/* -------------------- GHOST LEADERBOARD -------------------- */
function ghostLeaderboard(){
  const weekStart=startOfWeek();
  const thisWeek=S.workouts.filter(w=>parseD(w.date)>=weekStart).length;
  const best=bestWeekCount();
  return {thisWeek, best, delta:thisWeek-best};
}

function equipLabel(e){
  return {none:'No equipment',bands:'Resistance bands',dumbbells:'Dumbbells',gym:'Full gym'}[e]||e;
}
function previewDay(dayId){
  const d=DAYS[dayId], eq=S.profile.equipment;
  let html='<h3 style="margin-bottom:4px">'+d.name+'</h3><div class="small muted" style="margin-bottom:14px">'+d.focus+'</div>';
  d.slots.forEach(sl=>{
    const exId=resolveSlot(sl.slot,eq);
    const e=ex(exId);
    const t=getTarget(exId,sl);
    const dur = t.isTime ? t.val+'s' : t.val+(sl.perSide?' / leg':'');
    html+='<div class="list-item"><div class="avatar" style="padding:0;overflow:hidden">'+getExerciseVisual(e.cat,false)+'</div>'+
      '<div style="flex:1"><div style="font-weight:700;font-size:13.5px">'+e.name+'</div>'+
      '<div class="tiny muted">'+t.sets+' × '+dur+' · rest '+sl.rest+'s</div></div></div>';

function catIcon(c){
  return {push:'🫸',pull:'🪝',legs:'🦵',core:'🎯',conditioning:'⚡',mobility:'🧘'}[c]||'⚒';
}

function startWorkout(dayId){
  if(S.session){
    if(!confirm('A workout is already in progress. Start a new one and discard the current session?')) return;
  }
  const day=DAYS[dayId], eq=S.profile.equipment;
  const items=day.slots.map((sl,i)=>{
    const exId=resolveSlot(sl.slot,eq);
    const t=getTarget(exId,sl);
    return {
      key:i+'_'+exId, exId, label:sl.label||'', rest:sl.rest, perSide:!!sl.perSide, isTime:t.isTime,
      sets:Array.from({length:t.sets},()=>({target:t.val,actual:t.val,done:false})),
      difficulty:null, skipped:false
    };
  });
  S.session={dayId, name:day.name, startedAt:Date.now(), items};
  saveState();
  tab='train';
  render();
  window.scrollTo(0,0);
  speak('Workout started. '+day.name+'.');
}

function toggleFocus(){
  focusMode=!focusMode;
  document.body.classList.toggle('focus-mode',focusMode);
  render();
  if(focusMode) speak('Focus mode on. One exercise at a time.');
  else speak('Focus mode off.');
}

function findItem(key){ return S.session && S.session.items.find(i=>i.key===key); }
function setSetVal(key,i,val){
  const it=findItem(key); if(!it) return;
  it.sets[i].actual=Math.max(0,Number(val)||0);
  saveState();
}
function toggleSet(key,i){
  const it=findItem(key); if(!it) return;
  const st=it.sets[i];
  st.done=!st.done;
  saveState();
  if(st.done){ vibe(15); startRest(it.rest||60); speak('Set done. Rest.'); }
  render();
}
function setDifficulty(key,d){
  const it=findItem(key); if(!it) return;
  it.difficulty=d; saveState(); render();
}
function toggleSkip(key){
  const it=findItem(key); if(!it) return;
  it.skipped=!it.skipped; saveState(); render();
}
function replaceExercise(key){
  const it=findItem(key); if(!it) return;
  const cur=ex(it.exId);
  const pool=Object.keys(EXERCISES).filter(id=>{
    const e=EXERCISES[id];
    return e.cat===cur.cat && availableEx(id) && id!==it.exId;
  }).sort((a,b)=>Math.abs(EXERCISES[a].diff-cur.diff)-Math.abs(EXERCISES[b].diff-cur.diff));
  let html='<h3 style="margin-bottom:4px">Replace '+cur.name+'</h3>'+
    '<div class="small muted" style="margin-bottom:14px">Same category, available with your equipment.</div>';
  if(!pool.length) html+='<div class="empty">No alternatives available for this equipment profile.</div>';
  pool.forEach(id=>{
    const e=EXERCISES[id];
    html+='<div class="list-item" style="cursor:pointer" onclick="doReplace(\''+key+'\',\''+id+'\')">'+
      '<div class="avatar" style="padding:0;overflow:hidden">'+getExerciseVisual(id,false)+'</div><div style="flex:1">'+
      '<div style="font-weight:700;font-size:13.5px">'+e.name+'</div>'+
      '<div class="dots">'+dots(e.diff)+'</div></div><span class="muted">›</span></div>';
  });
  openModal(html);
}
function doReplace(key,newId){
  const it=findItem(key); if(!it) return;
  const e=ex(newId);
  it.exId=newId; it.isTime=e.type==='time';
  const t=getTarget(newId,{sets:it.sets.length, reps:8, time:30});
  it.sets=Array.from({length:t.sets},()=>({target:t.val,actual:t.val,done:false}));
  it.difficulty=null; it.skipped=false;
  saveState(); closeModal(); render();
  toast('Replaced with '+e.name);
  speak('Replaced with '+e.name);
}
function cancelSession(){
  if(!confirm('Cancel this session? Nothing will be saved.')) return;
  S.session=null; saveState(); stopRest(); render();
}

function finishSession(){
  const s=S.session; if(!s) return;
  const now=new Date();
  let xp=0;
  const prs=[];
  const entries=[];

  s.items.forEach(it=>{
    const e=ex(it.exId);
    const doneSets=it.sets.filter(x=>x.done);
    const entry={
      exId:it.exId, name:e.name, category:e.cat,
      sets:it.sets.map(x=>({target:x.target, actual:x.actual, done:x.done})),
      difficulty:it.difficulty, skipped:it.skipped
    };
    entries.push(entry);
    if(it.skipped || !doneSets.length) return;
    if(doneSets.length===it.sets.length) xp+=5; else xp+=2;
    doneSets.forEach(st=>{
      const val=Number(st.actual)||0;
      if(val<=0) return;
      const prev=S.prs[it.exId];
      if(!prev || val>prev.best){
        S.prs[it.exId]={best:val, date:dstr(now), type:e.type};
        prs.push({exId:it.exId, name:e.name, value:val, unit:e.type==='time'?'s':'reps'});
      }
    });
  });

  const allDone=s.items.every(it=>it.skipped || it.sets.every(x=>x.done));
  if(allDone) xp+=25;
  xp+=prs.length*20;

  const duration=Math.round((Date.now()-s.startedAt)/1000);
  const w={id:uid(), ts:now.toISOString(), date:dstr(now), dayId:s.dayId, name:s.name, entries, xp, duration,
    prs:prs.map(p=>p.name), equipment:S.profile.equipment};
  S.workouts.push(w);
  updateProgression(entries);
  addMuscleXP(w);
  S.xp+=xp;
  const unlocked=checkAchievements();
  if(unlocked.length) xp+=unlocked.reduce((t,a)=>t+a.xp,0);

  S.session=null;
  saveState();
  stopRest();
  vibe([30,50,30]);
  speak('Workout complete. Plus '+xp+' XP.');

  let html='<h3 style="margin-bottom:2px">Session Complete</h3>'+
    '<div class="small muted" style="margin-bottom:16px">'+esc(w.name)+' · '+fmtDateLong(w.date)+'</div>'+
    '<div class="grid3" style="margin-bottom:14px">'+
      '<div class="stat gold"><div class="v">+'+xp+'</div><div class="k">XP Earned</div></div>'+
      '<div class="stat"><div class="v">'+Math.round(duration/60)+'</div><div class="k">Minutes</div></div>'+
      '<div class="stat"><div class="v">'+entries.filter(e=>!e.skipped&&e.sets.some(x=>x.done)).length+'</div><div class="k">Exercises</div></div>'+
    '</div>';

  if(prs.length){
    html+='<div class="gold-box" style="margin-bottom:12px"><b>New personal records</b><br>'+
      prs.map(p=>'• '+p.name+' — '+p.value+' '+p.unit).join('<br>')+'</div>';
  }
  if(unlocked.length){
    html+='<div class="gold-box" style="margin-bottom:12px"><b>Achievements unlocked</b><br>'+
      unlocked.map(a=>a.ico+' '+a.name+' (+'+a.xp+' XP)').join('<br>')+'</div>';
  }
  html+='<button class="btn btn-gold" onclick="closeModal();go(\'home\')">Continue</button>';
  openModal(html);
  render();
}

let restState={left:0,total:0,running:false,id:null};
function startRest(sec){
  restState.total=sec; restState.left=sec; restState.running=true;
  clearInterval(restState.id);
  restState.id=setInterval(()=>{
    if(!restState.running) return;
    restState.left--;
    if(restState.left<=0){ stopRest(); toast('Rest complete','gold'); vibe([30,50,30]); speak('Rest complete.'); return; }
    updateRestBar();
  },1000);
  updateRestBar();
  speak('Rest for '+sec+' seconds.');
}
function stopRest(){
  clearInterval(restState.id); restState.id=null; restState.running=false;
  const el=document.getElementById('restbar');
  if(el) el.classList.add('hidden');
  document.body.classList.remove('has-rest');
}
function toggleRest(){ restState.running=!restState.running; updateRestBar(); }
function resetRest(){ restState.left=restState.total; restState.running=true; updateRestBar(); }
function updateRestBar(){
  const el=document.getElementById('restbar');
  if(!el) return;
  const visible = restState.total && (restState.left>0 || restState.running);
  if(!visible){ el.classList.add('hidden'); document.body.classList.remove('has-rest'); return; }
  el.classList.remove('hidden');
  document.body.classList.add('has-rest');
  el.innerHTML='<div><div class="lbl">Rest</div><div class="t">'+mmss(restState.left)+'</div></div>'+
    '<div style="flex:1"></div>'+
    '<button class="btn btn-ghost btn-sm" onclick="toggleRest()">'+(restState.running?'Pause':'Resume')+'</button>'+
    '<button class="btn btn-ghost btn-sm" onclick="resetRest()">Reset</button>'+
    '<button class="btn btn-ghost btn-sm" onclick="stopRest()">✕</button>';
}

function showExercise(id, swapKey){
  const e=ex(id);
  const eqList=e.equip.map(equipLabel).join(', ');
  let html='<div class="ex-anim-box">'+getExerciseVisual(id, true)+'</div>'+
    '<h3 style="margin-bottom:2px">'+e.name+'</h3>'+
    '<div class="row" style="gap:8px;margin:8px 0 14px;flex-wrap:wrap">'+
      '<span class="chip gold">'+e.cat+'</span>'+
      '<span class="chip">'+['','Beginner','Easy','Moderate','Hard','Expert'][e.diff]+'</span>'+
      '<span class="chip">'+(e.type==='time'?'Timed':'Reps')+'</span>'+
    '</div>';
  
  html+='<div class="sec-title" style="margin-top:0">Instructions</div><div class="card tight">'+
    e.steps.map((s,i)=>'<div style="display:flex;gap:9px;padding:5px 0"><b style="color:#e9b949">'+(i+1)+'.</b><span class="small">'+s+'</span></div>').join('')+
    '</div>';
  
  html+='<div class="sec-title">Muscles</div><div class="small muted" style="margin-bottom:12px">'+e.muscles.join(' · ')+'</div>';
  
  // Interactive Variations
  html+='<div class="sec-title">Variations</div>';
  html+='<div class="grid2" style="margin-bottom:16px">';
  if (e.easier) {
    html+='<div class="stat" style="cursor:pointer" onclick="showExercise(\''+e.easier+'\', \''+(swapKey||'')+'\')">'+
      '<div class="k" style="margin:0 0 4px">Easier</div>'+
      '<div class="small" style="font-weight:700;color:var(--gold)">'+ex(e.easier).name+' ›</div></div>';
  } else {
    html+='<div class="stat"><div class="k" style="margin:0 0 4px">Easier</div><div class="small muted">—</div></div>';
  }
  if (e.harder) {
    html+='<div class="stat" style="cursor:pointer" onclick="showExercise(\''+e.harder+'\', \''+(swapKey||'')+'\')">'+
      '<div class="k" style="margin:0 0 4px">Harder</div>'+
      '<div class="small" style="font-weight:700;color:var(--gold)">'+ex(e.harder).name+' ›</div></div>';
  } else {
    html+='<div class="stat"><div class="k" style="margin:0 0 4px">Harder</div><div class="small muted">—</div></div>';
  }
  html+='</div>';

  // Swap logic if opened from a workout session
  if (swapKey) {
    const currentIt = findItem(swapKey);
    if (currentIt) {
      if (currentIt.exId !== id) {
        html+='<button class="btn btn-gold" style="margin-bottom:12px" onclick="doReplace(\''+swapKey+'\', \''+id+'\')">Swap to this exercise</button>';
      } else {
        html+='<div class="gold-box center" style="margin-bottom:12px">Currently active in your workout</div>';
      }
    }
  }

  html+='<div class="sec-title">Equipment</div><div class="small muted" style="margin-bottom:16px">'+eqList+'</div>';
  html+='<button class="btn btn-ghost" onclick="closeModal()">Close</button>';
  openModal(html);
}

function libList(){
  const q=libSearch.trim().toLowerCase();
  const ids=Object.keys(EXERCISES).filter(id=>{
    const e=EXERCISES[id];
    if(libFilter!=='all' && e.cat!==libFilter) return false;
    if(q && (e.name.toLowerCase().indexOf(q)<0 && e.muscles.join(' ').toLowerCase().indexOf(q)<0)) return false;
    return true;
  }).sort((a,b)=>EXERCISES[a].diff-EXERCISES[b].diff || EXERCISES[a].name.localeCompare(EXERCISES[b].name));

  if(!ids.length) return '<div class="card"><div class="empty">No exercises match.</div></div>';

  let html='<div class="card tight">';
  ids.forEach(id=>{
    const e=EXERCISES[id];
    const av=availableEx(id);
    html+='<div class="list-item" style="cursor:pointer;'+(av?'':'opacity:.45')+'" onclick="showExercise(\''+id+'\')">'+
      '<div class="avatar" style="padding:0;overflow:hidden">'+getExerciseVisual(id,false)+'</div>'+
      '<div style="flex:1"><div style="font-weight:700;font-size:13.5px">'+e.name+'</div>'+
      '<div class="dots">'+dots(e.diff)+'</div></div>'+
      (av?'<span class="chip green">Ready</span>':'<span class="chip">Needs gear</span>')+
    '</div>';
  });
  html+='</div>';
  html+='<div class="note-box" style="margin-top:12px">Exercises marked <b>Needs gear</b> are hidden from your programme until you switch equipment in Settings. '+
    'Your XP, records and history are never affected by that change.</div>';
  return html;
}

function viewAssess(){
  const hist=S.assessments.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const last=hist[0];
  const due=!last || daysBetween(last.date,todayStr())>=S.profile.assessIntervalDays;
  let html='<div class="sec-title">Athletic Assessment</div>';

  html+='<div class="warn-box" style="margin-bottom:12px">'+
    '<b>Safety first.</b> These are beginner-appropriate tests, not maximal-effort trials. Stop immediately if you feel pain, '+
    'dizziness, or unusual discomfort. Never push to failure on a first attempt — record an honest number you could repeat tomorrow.</div>';

  html+='<div class="card '+(due?'gold':'')+'">'+
    '<div class="between"><div><div style="font-size:16px;font-weight:800">'+(last?'Reassessment':'Baseline Assessment')+'</div>'+
    '<div class="tiny muted">'+(last?'Last: '+fmtDateLong(last.date)+' ('+daysBetween(last.date,todayStr())+' days ago)':'No assessment recorded yet')+'</div></div></div>'+
    '<button class="btn btn-gold" style="margin-top:14px" onclick="startAssessment()">'+(last?'Start Reassessment':'Start Assessment')+'</button>'+
  '</div>';

  if(last){
    html+='<div class="sec-title">Current Baseline</div>';
    const prev=hist[1];
    const rows=[
      ['Push-ups (reps)', last.pushups, 'pushups'],
      ['Squats in 60s', last.squats60, 'squats60'],
      ['Plank (sec)', last.plank, 'plank'],
      ['Side plank L (sec)', last.sideL, 'sideL'],
      ['Side plank R (sec)', last.sideR, 'sideR'],
      ['Wall sit (sec)', last.wallSit, 'wallSit'],
      ['Mobility score', last.mobilityTotal, 'mobilityTotal'],
      ['Step test (2 min)', last.stepTest, 'stepTest']
    ];
    html+='<div class="card tight"><table class="hist"><tr><th>Test</th><th>Result</th><th>Change</th></tr>';
    rows.forEach(([k,v,key])=>{
      if(v==null||v==='') return;
      let delta='—';
      if(prev && prev[key]!=null && prev[key]!==''){
        const d=Number(v)-Number(prev[key]);
        const pct=prev[key]?Math.round((d/Number(prev[key]))*100):0;
        delta=(d>0?'+':'')+d+(pct?' ('+(d>0?'+':'')+pct+'%)':'');
        if(d===0) delta='±0';
      }
      html+='<tr><td>'+k+'</td><td style="font-weight:800">'+v+'</td><td style="color:'+
        (String(delta).indexOf('+')===0?'#37d67a':(delta==='—'?'#8a8a99':'#f4f4f7'))+'">'+delta+'</td></tr>';
    });
    html+='</table></div>';
  }

  if(hist.length>=2){
    html+='<div class="sec-title">Progress Charts</div>';
    const charts=[['Push-ups','pushups'],['Plank (sec)','plank'],['Squats / 60s','squats60'],['Mobility','mobilityTotal']];
    charts.forEach(([label,key])=>{
      const data=hist.slice().reverse().filter(a=>a[key]!=null&&a[key]!=='').map(a=>({label:a.date,value:Number(a[key])}));
      if(data.length<2) return;
      html+='<div class="card tight"><div class="small" style="font-weight:800;margin-bottom:8px">'+label+'</div>'+
        lineChart(data,{h:120})+'</div>';
    });
  }

  if(hist.length){
    html+='<div class="sec-title">Assessment History</div><div class="card tight">';
    hist.forEach(a=>{
      html+='<div class="list-item"><div class="avatar">📊</div><div style="flex:1">'+
        '<div style="font-weight:700;font-size:13.5px">'+fmtDateLong(a.date)+'</div>'+
        '<div class="tiny muted">Push '+a.pushups+' · Plank '+a.plank+'s · Squat '+a.squats60+'</div></div></div>';
    });
    html+='</div>';
  }
  return html;
}

function saveAssessment(){
  const num=id=>{ const el=document.getElementById('as_'+id); const v=el?el.value.trim():''; return v===''?null:Number(v); };
  const a={
    id:uid(), date:todayStr(),
    pushups:num('pushups'), squats60:num('squats60'), plank:num('plank'),
    sideL:num('sideL'), sideR:num('sideR'), wallSit:num('wallSit'),
    stepTest:num('stepTest'),
    notes:(document.getElementById('as_notes')||{}).value||''
  };
  const ms=Number((document.getElementById('as_mobSquat')||{}).value||2);
  const mr=Number((document.getElementById('as_mobReach')||{}).value||2);
  const msh=Number((document.getElementById('as_mobShoulder')||{}).value||2);
  a.mobilitySquat=ms; a.mobilityReach=mr; a.mobilityShoulder=msh; a.mobilityTotal=ms+mr+msh;

  S.assessments.push(a);
  S.xp+=40;
  const unlocked=checkAchievements();
  if(unlocked.length) S.xp+=unlocked.reduce((t,x)=>t+x.xp,0);
  saveState();
  closeModal();
  toast('+40 XP · Assessment saved','gold');
  speak('Assessment saved. Plus 40 XP.');
  render();
}

function saveMeasurement(){
  const keys=['weight','height','chest','waist','hips','arm','forearm','thigh','calf'];
  const rec={id:uid(), date:todayStr()};
  let any=false;
  keys.forEach(k=>{
    const el=document.getElementById('m_'+k);
    const v=el?el.value.trim():'';
    if(v!==''){ rec[k]=Number(v); any=true; }
  });
  rec.notes=(document.getElementById('m_notes')||{}).value||'';
  if(!any && !rec.notes){ toast('Enter at least one value'); return; }
  S.measurements=S.measurements.filter(x=>x.date!==rec.date);
  S.measurements.push(rec);
  S.xp+=10;
  checkAchievements();
  saveState(); closeModal(); render();
  toast('Measurement logged · +10 XP','gold');
}
function delMeasurement(id){
  if(!confirm('Delete this measurement?')) return;
  S.measurements=S.measurements.filter(x=>x.id!==id);
  saveState(); render();
}

function handlePhoto(ev,view){
  const file=ev.target.files && ev.target.files[0];
  if(!file) return;
  resizeImage(file,800,0.7).then(data=>{
    pruneOldPhotos(true);
    const photo={id:uid(), date:todayStr(), ts:Date.now(), view, data, notes:''};
    S.photos.push(photo);
    const ok=saveState();
    if(!ok){ S.photos=S.photos.filter(p=>p.id!==photo.id); return; }
    S.xp+=10;
    checkAchievements();
    saveState();
    render();
    vibe(20);
    toast('Photo saved · +10 XP','gold');
  }).catch(()=>toast('Could not read that image'));
  ev.target.value='';
}
function resizeImage(file,maxDim,quality){
  return new Promise((res,rej)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;
      const scale=Math.min(1,maxDim/Math.max(w,h));
      w=Math.round(w*scale); h=Math.round(h*scale);
      const c=document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}

function viewStats(){
  const totalSessions=S.workouts.length;
  let totalExercises=0;
  S.workouts.forEach(w=>{ totalExercises+=(w.entries||[]).filter(e=>!e.skipped&&e.sets.some(s=>s.done)).length; });
  let html='<div class="sec-title">Training Totals</div>';
  html+='<div class="grid3">'+
    '<div class="stat"><div class="v">'+totalSessions+'</div><div class="k">Sessions</div></div>'+
    '<div class="stat"><div class="v">'+totalExercises+'</div><div class="k">Exercises</div></div>'+
    '<div class="stat gold"><div class="v">'+Math.round(totalTrainingSeconds()/60)+'</div><div class="k">Minutes</div></div>'+
  '</div>';

  const weeks=[];
  for(let i=7;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i*7);
    const start=startOfWeek(d);
    const end=new Date(start); end.setDate(end.getDate()+7);
    const count=S.workouts.filter(w=>{ const wd=parseD(w.date); return wd>=start && wd<end; }).length;
    weeks.push({label:dstr(start).slice(5), value:count});
  }
  html+='<div class="sec-title">Last 8 Weeks</div>';
  html+='<div class="card tight">'+barChart(weeks,{h:130})+'</div>';

  const prIds=Object.keys(S.prs);
  if(prIds.length){
    html+='<div class="sec-title">Personal Records</div>';
    html+='<div class="card tight">';
    prIds.sort((a,b)=>S.prs[b].date.localeCompare(S.prs[a].date)).forEach(id=>{
      const p=S.prs[id];
      html+='<div class="list-item"><div class="avatar">🏅</div><div style="flex:1">'+
        '<div style="font-weight:700;font-size:13.5px">'+ex(id).name+'</div>'+
        '<div class="tiny muted">'+p.best+' '+(p.type==='time'?'sec':'reps')+' · '+fmtDate(p.date)+'</div></div></div>';
    });
    html+='</div>';
  }

  const tracked=['push-up','plank','bodyweight-squat','pike-push-up','glute-bridge','side-plank'];
  html+='<div class="sec-title">Exercise Progress</div>';
  html+='<div class="row" style="gap:6px;overflow-x:auto;padding-bottom:10px">'+
    tracked.map(id=>'<button class="btn btn-sm '+(chartExercise===id?'btn-gold':'btn-ghost')+'" style="flex:0 0 auto" '+
      'onclick="chartExercise=\''+id+'\';render()">'+ex(id).name+'</button>').join('')+'</div>';
  const pts=[];
  S.workouts.slice().sort((a,b)=>new Date(a.ts)-new Date(b.ts)).forEach(w=>{
    const e=(w.entries||[]).find(x=>x.exId===chartExercise);
    if(!e) return;
    const best=Math.max(0,...e.sets.filter(s=>s.done).map(s=>Number(s.actual)||0));
    if(best>0) pts.push({label:w.date, value:best});
  });
  html+='<div class="card tight">'+lineChart(pts,{h:150})+'</div>';

  html+='<div class="sec-title">Workout History</div>';
  if(!S.workouts.length){
    html+='<div class="card"><div class="empty">No workouts yet.</div></div>';
  } else {
    html+='<div class="card tight">';
    S.workouts.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts)).slice(0,40).forEach(w=>{
      html+='<div class="list-item"><div class="avatar">'+(w.dayId==='E'?'🧘':'⚒')+'</div>'+
        '<div style="flex:1"><div style="font-weight:700;font-size:13.5px">'+esc(w.name)+'</div>'+
        '<div class="tiny muted">'+fmtDate(w.date)+' · '+Math.round((w.duration||0)/60)+' min · '+w.xp+' XP'+
        (w.prs&&w.prs.length?' · 🏅 '+w.prs.length:'')+'</div></div>'+
        '<button class="btn btn-ghost btn-sm" onclick="delWorkout(\''+w.id+'\')" style="padding:6px 9px">✕</button></div>';
    });
    html+='</div>';
  }
  return html;
}
function delWorkout(id){
  const w=S.workouts.find(x=>x.id===id); if(!w) return;
  if(!confirm('Delete this workout? '+w.xp+' XP will be removed. Achievements stay.')) return;
  S.workouts=S.workouts.filter(x=>x.id!==id);
  S.xp=Math.max(0,S.xp-w.xp);
  recomputePRs();
  saveState(); render();
  toast('Workout deleted');
}
function recomputePRs(){
  const prs={};
  S.workouts.forEach(wo=>{
    (wo.entries||[]).forEach(e=>{
      (e.sets||[]).forEach(s=>{
        if(!s.done) return;
        const v=Number(s.actual)||0;
        if(v<=0) return;
        const prev=prs[e.exId];
        if(!prev || v>prev.best) prs[e.exId]={best:v, date:wo.date, type:ex(e.exId).type};
      });
    });
  });
  S.prs=prs;
}

function lineChart(data,opt){
  opt=opt||{};
  const w=opt.w||330, h=opt.h||150, padL=32, padR=10, padT=14, padB=24;
  if(!data||data.length<2) return '<div class="empty">Not enough data yet — log at least two entries.</div>';
  const vals=data.map(d=>d.value);
  let min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(min===max){ min-=1; max+=1; }
  const range=max-min;
  const iw=w-padL-padR, ih=h-padT-padB;
  const pts=data.map((d,i)=>{
    const x=padL+(i*iw)/(data.length-1);
    const y=padT+ih-((d.value-min)/range)*ih;
    return {x,y,d};
  });
  const line=pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const area=padL+','+(padT+ih)+' '+line+' '+pts[pts.length-1].x.toFixed(1)+','+(padT+ih);
  let grid='';
  for(let i=0;i<=3;i++){
    const y=padT+(ih/3)*i;
    const v=(max-(range/3)*i);
    grid+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="#242430" stroke-width="1"/>'+
      '<text x="'+(padL-6)+'" y="'+(y+3.5).toFixed(1)+'" fill="#6c6c7a" font-size="9" text-anchor="end">'+
      (Math.round(v*10)/10)+'</text>';
  }
  let dots='';
  pts.forEach(p=>{ dots+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="#e9b949"/>'; });
  const firstX=pts[0].x.toFixed(1), lastX=pts[pts.length-1].x.toFixed(1);
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;display:block">'+
    grid+
    '<polygon points="'+area+'" fill="rgba(233,185,73,.12)"/>'+
    '<polyline points="'+line+'" fill="none" stroke="#e9b949" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+
    '<text x="'+firstX+'" y="'+(h-6)+'" fill="#6c6c7a" font-size="9" text-anchor="start">'+data[0].label.slice(5)+'</text>'+
    '<text x="'+lastX+'" y="'+(h-6)+'" fill="#6c6c7a" font-size="9" text-anchor="end">'+data[data.length-1].label.slice(5)+'</text>'+
  '</svg>';
}
function barChart(data,opt){
  opt=opt||{};
  const w=330, h=opt.h||130, padB=22, padT=10;
  const max=Math.max(1,Math.max.apply(null,data.map(d=>d.value)));
  const bw=w/data.length;
  let bars='';
  data.forEach((d,i)=>{
    const bh=((d.value/max)*(h-padB-padT));
    const x=i*bw+bw*0.2, y=h-padB-bh, bwidth=bw*0.6;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bwidth.toFixed(1)+'" height="'+Math.max(bh,1).toFixed(1)+'" rx="3" fill="'+(d.value>0?'#e9b949':'#2a2a34')+'"/>'+
      '<text x="'+(x+bwidth/2).toFixed(1)+'" y="'+(h-6)+'" fill="#6c6c7a" font-size="8.5" text-anchor="middle">'+d.label+'</text>';
    if(d.value>0) bars+='<text x="'+(x+bwidth/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" fill="#a0a0b0" font-size="8.5" text-anchor="middle">'+d.value+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;display:block">'+bars+'</svg>';
}

    '<div class="list-item"><div style="flex:1"><div style="font-weight:700;font-size:13.5px">Currently stored</div>'+
    '<div class="tiny muted">'+ps.count+' photo'+(ps.count===1?'':'s')+' · ~'+ps.approxKB+' KB</div></div></div>'+

    '<div class="tiny muted">Remove photos older than '+PHOTO_RETENTION_DAYS+' days immediately</div></div>'+
    '<button class="btn btn-ghost btn-sm" onclick="runPruneNow()">Prune</button></div>'+

  html+='<div class="sec-title">Data</div>';

    '<div class="tiny muted">Restore from a JSON file</div></div>'+

    '<div class="list-item"><div style="flex:1"><div style="font-weight:700;font-size:13.5px;color:#ff5c5c">Reset all data</div>'+
    '<div class="tiny muted">Cannot be undone</div></div>'+

  html+='<div class="sec-title">Achievements</div>';
  html+='<div class="card tight">';
  ACHIEVEMENTS.forEach(a=>{
    const un=S.achievements[a.id];
    html+='<div class="ach '+(un?'':'locked')+'"><div class="ico">'+a.ico+'</div>'+
      '<div style="flex:1"><div style="font-weight:700;font-size:13px">'+a.name+'</div>'+
      '<div class="tiny muted">'+a.desc+'</div></div>'+
      '<span class="chip '+(un?'green':'')+'">'+(un?'✓':'+'+a.xp+' XP')+'</span></div>';
  });
  html+='</div>';

  html+='<button class="btn btn-gold" onclick="saveSettings()">Save Settings</button>';
  html+='<button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Close</button>';

}
function runPruneNow(){
  const removed=pruneOldPhotos(false);
  if(!removed) toast('No photos to prune');
  else openSettings();
}
function changeEquipment(eq){
  if(S.profile.equipment===eq) return;
  S.profile.equipment=eq;
  S.profile.equipmentChanges=(S.profile.equipmentChanges||0)+1;
  saveState();
  checkAchievements();
  saveState();
  openSettings();
  toast('Equipment changed to '+equipLabel(eq)+' · history preserved','gold');
}
function saveSettings(){
  const n=document.getElementById('set_name');
  if(n) S.profile.name=n.value.trim()||'Athlete';
  const iv=document.getElementById('set_interval');
  if(iv) S.profile.assessIntervalDays=Math.max(7,Number(iv.value)||28);
  saveState(); closeModal(); render();
  toast('Settings saved');
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='forge-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('Backup downloaded');
}
function importData(ev){
  const f=ev.target.files&&ev.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data || typeof data!=='object') throw new Error('bad');
      S=Object.assign(freshState(),data);
      S.profile=Object.assign(freshState().profile,data.profile||{});
      S.session=null;
      saveState(); closeModal(); render();
      toast('Backup restored','gold');
    }catch(e){ toast('Invalid backup file'); }
  };
  r.readAsText(f);
  ev.target.value='';
}
function resetAll(){
  if(!confirm('Delete ALL data? This cannot be undone.')) return;
  if(!confirm('Really sure? Workouts, XP, photos and measurements will be erased.')) return;
  localStorage.removeItem(KEY);
  S=freshState();
  saveState();
  closeModal(); render();
  toast('All data reset');
}

window.addEventListener('beforeunload',()=>{ if(S.session) saveState(); });
